name: Demo-Factory CI

# The factory is developed with its own discipline: PRs, CI, Copilot review, and human approval.
# The factory NEVER merges changes to itself (§15).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  dotnet-build-and-test:
    name: build-and-test-dotnet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '11.0.x'
      - name: Restore
        run: dotnet restore DemoFactory.slnx
      - name: Build
        run: dotnet build DemoFactory.slnx --no-restore -c Release
      - name: Run Domain, Replay & E2E Tests
        run: dotnet test DemoFactory.slnx --no-build -c Release --verbosity normal

  web-build-and-test:
    name: build-and-test-web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - run: npm install --legacy-peer-deps
      - run: npm run build
      - run: npm test

  bicep-validate:
    name: validate-bicep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: az bicep build --file infra/main.bicep --stdout > /dev/null
