# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json
name: demo-factory
metadata:
  template: demo-factory@0.8.0

infra:
  provider: bicep
  path: ./infra

services:
  factory-api:
    project: ./src/DemoFactory.Api
    language: dotnet
    host: containerapp
    docker:
      path: ../../Dockerfile
      context: ../..
      remoteBuild: true

hooks:
  postprovision:
    posix:
      shell: sh
      run: ./scripts/grant-sql-access.sh
    windows:
      shell: pwsh
      run: ./scripts/grant-sql-access.ps1
